[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthesis-deliberator"
version = "0.1.0"
description = "Slow synthesis that holds three competing interpretations of research evidence open before the researcher settles. CPR Phase II, Frame A tool 3."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kostas Kazakos" }]
keywords = ["research-methods", "uxr", "cpr", "ai-native-research", "research-synthesis", "competing-hypotheses", "llm-reasoning"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

# AI deps live in core (not extras): the AI layer is part of the tool,
# even though the deterministic core runs without it.
dependencies = [
    "click>=8.1",
    "litellm>=1.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8.0"]

[project.scripts]
sdl = "synthesis_deliberator.cli:main"

[tool.setuptools.packages.find]
include = ["synthesis_deliberator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
